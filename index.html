<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>석유화학 시황 리포트 허브 | GitHub Pages</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-cyan-500 selection:text-white">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 shadow-xl">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex flex-col sm:flex-row items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-600 to-blue-700 flex items-center justify-center shadow-lg shadow-cyan-900/30 text-white font-bold text-lg">
          📊
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-lg sm:text-xl font-extrabold text-white tracking-tight">석유화학 시황 리포트 허브</h1>
            <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-cyan-950 text-cyan-400 border border-cyan-800 uppercase">GitHub Pages</span>
          </div>
          <p class="text-xs text-slate-400">아시아 원유·석유화학 일간 / 주간 / 월간 / 스페셜 기획 리포트 공개 아카이브</p>
        </div>
      </div>
      <div class="flex items-center gap-3 text-xs">
        <a href="https://github.com/Jduck02/petro-report" target="_blank" rel="noreferrer" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 flex items-center gap-1.5 font-semibold transition">
          <span>GitHub 저장소</span> ↗
        </a>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-6xl w-full mx-auto px-4 sm:px-6 py-8 flex-1 space-y-6">

    <!-- Category Tabs -->
    <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-2 sm:p-3 shadow-lg flex flex-wrap gap-2">
      <button onclick="setCategory('all')" id="tab-all" class="cat-tab px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold bg-blue-600 text-white transition flex items-center gap-2">
        전체 보고서 <span id="count-all" class="px-2 py-0.5 rounded-full text-[11px] bg-white/20">0</span>
      </button>
      <button onclick="setCategory('daily')" id="tab-daily" class="cat-tab px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold text-slate-300 hover:text-white hover:bg-slate-800 transition flex items-center gap-2">
        ☀️ 일간 보고서 <span id="count-daily" class="px-2 py-0.5 rounded-full text-[11px] bg-slate-800 text-emerald-400">0</span>
      </button>
      <button onclick="setCategory('weekly')" id="tab-weekly" class="cat-tab px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold text-slate-300 hover:text-white hover:bg-slate-800 transition flex items-center gap-2">
        📊 주간 보고서 <span id="count-weekly" class="px-2 py-0.5 rounded-full text-[11px] bg-slate-800 text-cyan-400">0</span>
      </button>
      <button onclick="setCategory('monthly')" id="tab-monthly" class="cat-tab px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold text-slate-300 hover:text-white hover:bg-slate-800 transition flex items-center gap-2">
        📅 월간 보고서 <span id="count-monthly" class="px-2 py-0.5 rounded-full text-[11px] bg-slate-800 text-amber-400">0</span>
      </button>
      <button onclick="setCategory('special')" id="tab-special" class="cat-tab px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold text-slate-300 hover:text-white hover:bg-slate-800 transition flex items-center gap-2">
        💡 스페셜 기획 <span id="count-special" class="px-2 py-0.5 rounded-full text-[11px] bg-slate-800 text-purple-400">0</span>
      </button>
    </div>

    <!-- Search Toolbar -->
    <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 flex flex-col sm:flex-row items-center justify-between gap-3">
      <div class="relative w-full sm:flex-1">
        <input type="text" id="searchInput" oninput="renderReports()" placeholder="제목, 키워드, 유종 검색 (예: 나프타, 에틸렌, Brent, BEP, 마진)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-xs sm:text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500">
      </div>
      <div id="resultsCount" class="text-xs text-slate-400 whitespace-nowrap shrink-0"></div>
    </div>

    <!-- Vertically Stacked Bars List -->
    <div id="reportsList" class="space-y-3.5"></div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden bg-slate-900/60 border border-dashed border-slate-800 rounded-2xl p-12 text-center space-y-3">
      <div class="text-3xl">🔍</div>
      <h3 class="text-base font-bold text-white">해당 조건의 보고서가 없습니다</h3>
      <p class="text-xs text-slate-400">검색어를 변경하거나 다른 카테고리를 선택해보세요.</p>
    </div>

  </main>

  <!-- Modal Reader -->
  <div id="readerModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-2 sm:p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-6xl h-[92vh] flex flex-col overflow-hidden shadow-2xl">
      <!-- Modal Top -->
      <div class="bg-slate-950 border-b border-slate-800 px-4 py-3 flex items-center justify-between gap-3 shrink-0">
        <h3 id="modalTitle" class="text-sm sm:text-base font-bold text-white truncate max-w-xl"></h3>
        <div class="flex items-center gap-2">
          <button onclick="printReport()" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 flex items-center gap-1 transition">
            🖨️ 인쇄 / PDF
          </button>
          <a id="modalExternalLink" href="#" target="_blank" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 flex items-center gap-1 transition">
            새 창으로 열기 ↗
          </a>
          <button onclick="closeModal()" class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-red-950/60 transition text-lg font-bold">
            ✕
          </button>
        </div>
      </div>
      <!-- Modal Iframe -->
      <div class="flex-1 bg-white relative w-full h-full overflow-hidden">
        <iframe id="modalIframe" src="" class="w-full h-full border-none"></iframe>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-slate-950 border-t border-slate-900 py-6 text-center text-xs text-slate-500 mt-auto">
    <p>© 2026 Petrochemical Market Intelligence Group | Hosted on GitHub Pages</p>
  </footer>

  <script>
    const ALL_REPORTS = [
  {
    "id": "plattsai-daily-2026-10-26",
    "title": "아시아 원유·석유화학 데일리 시황 | 2026-10-26",
    "category": "daily",
    "date": "2026-10-26",
    "summary": "원유·원료 변동성 확대 속 주요 제품 차별화, 하류 유도품의 원가 전가는 제한적. 나프타와 LPG 등 원료가는 강세를 이어갔으나 원유는 유종별 혼조세를 보였습니다. 스프레드 및 설비 동향 분석.",
    "tags": [
      "원유",
      "나프타",
      "에틸렌",
      "LPG",
      "CFR NEA",
      "FOB Korea"
    ],
    "author": "PlattsAI Intelligence",
    "filePath": "./reports/daily/2026-10-26_아시아_원유석유화학_데일리_시황_2026-10-26.html"
  },
  {
    "id": "petrochem-weekly-2026-42w",
    "title": "아시아 원유·석유화학 주간 시황 및 차주 전망 (Asia Crude & Petrochemical Weekly Market Report & Outlook)",
    "category": "weekly",
    "date": "2026-10-23",
    "summary": "유가 폭등 및 공급 타이트로 아시아 석유화학 원가 부담 극대화. ICE Brent $114/b 돌파 및 일본 나프타 $1,030/mt 달성으로 NCC 에틸렌 마진 마이너스 대폭 확대. 차주 수급 및 BEP 마진 체인 분석.",
    "tags": [
      "원유",
      "나프타",
      "에틸렌",
      "부타디엔",
      "PX",
      "BEP분석",
      "주간전망"
    ],
    "author": "PlattsAI Petrochemical Intelligence Group",
    "filePath": "./reports/weekly/2026-10-23_아시아_원유석유화학_주간_시황_및_차주_전망_asia_crude_petrochemical_.html"
  },
  {
    "id": "special-ncc-vs-ecc-2026",
    "title": "[기획] 2026 하반기 글로벌 NCC vs 미국·중동 ECC 원가 경쟁력 및 에탄 크래커 영향 분석",
    "category": "special",
    "date": "2026-10-18",
    "summary": "고유가($100+/b) 국면에서 아시아 나프타 분해설비(NCC)와 북미 에탄 분해설비(ECC) 간의 톤당 에틸렌 생산 현금원가 스프레드가 $450/mt 이상으로 확대됨에 따른 아시아 석화사 대응 전략.",
    "tags": [
      "스페셜기획",
      "NCC",
      "ECC",
      "원가경쟁력",
      "에탄크래커",
      "마진분석"
    ],
    "author": "전략기획팀",
    "filePath": "./reports/special/2026-10-18_기획_2026_하반기_글로벌_ncc_vs_미국중동_ecc_원가_경쟁력_및_에탄_크래커_영향.html"
  },
  {
    "id": "monthly-northeast-asia-2026-10",
    "title": "2026년 10월 아시아 올레핀·아로마틱 월간 수급 및 설비 정기보수 총람",
    "category": "monthly",
    "date": "2026-10-01",
    "summary": "10~11월 동북아 NCC 정기보수 집중 일정과 주요 화학단지 가동률 변동 추이. 크래커 감산에 따른 기초유분 수급 긴축 및 다운스트림 폴리머 재고 변동 종합 진단.",
    "tags": [
      "월간수급",
      "정기보수",
      "가동률",
      "크래커",
      "아로마틱"
    ],
    "author": "시장분석실",
    "filePath": "./reports/monthly/2026-10-01_2026년_10월_아시아_올레핀아로마틱_월간_수급_및_설비_정기보수_총람.html"
  }
];
    let currentCategory = 'all';

    function getCategoryBadge(cat) {
      switch(cat) {
        case 'daily': return { name: '일간 보고서', bg: 'bg-emerald-500/10', color: 'text-emerald-400', border: 'border-emerald-500/30', borderL: 'border-l-emerald-500 hover:border-l-emerald-400', icon: '☀️' };
        case 'weekly': return { name: '주간 보고서', bg: 'bg-cyan-500/10', color: 'text-cyan-400', border: 'border-cyan-500/30', borderL: 'border-l-cyan-500 hover:border-l-cyan-400', icon: '📊' };
        case 'monthly': return { name: '월간 보고서', bg: 'bg-amber-500/10', color: 'text-amber-400', border: 'border-amber-500/30', borderL: 'border-l-amber-500 hover:border-l-amber-400', icon: '📅' };
        case 'special': return { name: '스페셜 기획', bg: 'bg-purple-500/10', color: 'text-purple-400', border: 'border-purple-500/30', borderL: 'border-l-purple-500 hover:border-l-purple-400', icon: '💡' };
        default: return { name: '보고서', bg: 'bg-slate-800', color: 'text-slate-300', border: 'border-slate-700', borderL: 'border-l-blue-500', icon: '📄' };
      }
    }

    function updateCounts() {
      document.getElementById('count-all').innerText = ALL_REPORTS.length;
      document.getElementById('count-daily').innerText = ALL_REPORTS.filter(r => r.category === 'daily').length;
      document.getElementById('count-weekly').innerText = ALL_REPORTS.filter(r => r.category === 'weekly').length;
      document.getElementById('count-monthly').innerText = ALL_REPORTS.filter(r => r.category === 'monthly').length;
      document.getElementById('count-special').innerText = ALL_REPORTS.filter(r => r.category === 'special').length;
    }

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-tab').forEach(b => {
        b.className = 'cat-tab px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold text-slate-300 hover:text-white hover:bg-slate-800 transition flex items-center gap-2';
      });
      const activeBtn = document.getElementById('tab-' + cat);
      if (activeBtn) {
        activeBtn.className = 'cat-tab px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold bg-blue-600 text-white transition flex items-center gap-2 shadow-md';
      }
      renderReports();
    }

    function renderReports() {
      const q = (document.getElementById('searchInput').value || '').toLowerCase().trim();
      const list = document.getElementById('reportsList');
      const emptyState = document.getElementById('emptyState');

      const filtered = ALL_REPORTS.filter(r => {
        if (currentCategory !== 'all' && r.category !== currentCategory) return false;
        if (q) {
          const matchTitle = r.title.toLowerCase().includes(q);
          const matchSummary = (r.summary || '').toLowerCase().includes(q);
          const matchDate = r.date.includes(q);
          const matchTags = (r.tags || []).some(t => t.toLowerCase().includes(q));
          if (!matchTitle && !matchSummary && !matchDate && !matchTags) return false;
        }
        return true;
      });

      document.getElementById('resultsCount').innerText = '총 ' + filtered.length + '개 보고서 표시 중';

      if (filtered.length === 0) {
        list.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      list.innerHTML = filtered.map(r => {
        const badge = getCategoryBadge(r.category);
        const tagsHtml = (r.tags || []).map(t => '<span class="px-2 py-0.5 rounded-md text-[11px] bg-slate-950 text-slate-400 border border-slate-800">#' + t + '</span>').join('');

        return `
          <div onclick="openModal('${r.filePath}', '${r.title.replace(/'/g, "\\'")}')" class="group w-full bg-slate-900/90 hover:bg-slate-900 border border-slate-800 hover:border-slate-700 rounded-2xl p-4 sm:p-5 shadow-lg transition-all duration-200 cursor-pointer flex flex-col lg:flex-row lg:items-center justify-between gap-4 border-l-4 ${badge.borderL} hover:shadow-cyan-950/20 hover:-translate-y-0.5">
            <div class="flex flex-col sm:flex-row sm:items-start gap-4 flex-1 min-w-0">
              <div class="flex sm:flex-col items-center sm:items-start gap-2 sm:gap-1.5 shrink-0 sm:w-36">
                <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-bold border ${badge.bg} ${badge.color} ${badge.border}">
                  <span>${badge.icon}</span> ${badge.name}
                </span>
                <span class="text-xs text-slate-400 font-mono">🕒 ${r.date}</span>
              </div>
              <div class="flex-1 min-w-0 space-y-1.5">
                <h3 class="text-base sm:text-lg font-bold text-white group-hover:text-cyan-300 transition-colors line-clamp-1">${r.title}</h3>
                <p class="text-xs sm:text-sm text-slate-400 line-clamp-2 leading-relaxed">${r.summary}</p>
                <div class="flex flex-wrap items-center gap-2 pt-1">
                  <span class="text-[11px] text-slate-500 font-medium">${r.author}</span>
                  <span class="text-slate-700">•</span>
                  <div class="flex flex-wrap gap-1.5">${tagsHtml}</div>
                </div>
              </div>
            </div>
            <div class="flex items-center justify-between lg:justify-end gap-2 pt-3 lg:pt-0 border-t border-slate-800/80 lg:border-t-0 shrink-0" onclick="event.stopPropagation()">
              <a href="${r.filePath}" target="_blank" title="새 탭에서 전체화면 보기" class="px-3 py-2 rounded-xl text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition">
                새 창 열기 ↗
              </a>
              <button onclick="openModal('${r.filePath}', '${r.title.replace(/'/g, "\\'")}')" class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs flex items-center gap-1.5 shadow-md shadow-blue-900/30 transition">
                <span>열람하기</span> →
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function openModal(filePath, title) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalIframe').src = filePath;
      document.getElementById('modalExternalLink').href = filePath;
      document.getElementById('readerModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('readerModal').classList.add('hidden');
      document.getElementById('modalIframe').src = '';
    }

    function printReport() {
      const iframe = document.getElementById('modalIframe');
      if (iframe && iframe.contentWindow) {
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    window.onload = () => {
      updateCounts();
      renderReports();
    };
  </script>
</body>
</html>
